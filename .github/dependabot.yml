version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Runtime dependencies are compiled into dist/index.js. Update them
      # manually so the reviewed pull request includes the rebuilt bundle.
      # update-types only applies to version updates, so security updates
      # remain eligible for Dependabot pull requests.
      - dependency-name: "@actions/*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # typescript-eslint 8 currently declares support through TypeScript 6.
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
