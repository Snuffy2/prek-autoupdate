name: prek-autofix Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: prek-autofix-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.review.outputs.changed }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Review with prek
        id: review
        uses: Snuffy2/prek-autofix/review@v1

  signal:
    needs: review
    if: needs.review.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report pending prek fixes
        run: exit 1
