name: prek-autofix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prek-autofix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    name: Collect prek fixes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          repository:
            ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Collect prek fixes
        id: collect
        uses: Snuffy2/prek-autofix/collect@v1

  signal:
    name: Report pending prek fixes
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fail when fixes are pending
        run: exit 1
