name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.release.prerelease == false
    outputs:
      major-tag: ${{ steps.release.outputs.major-tag }}
      source-sha: ${{ steps.release.outputs.source-sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out published release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: release/package-lock.json

      - name: Set up prek
        uses: j178/prek-action@v2
        with:
          install-only: true

      - run: npm ci --ignore-scripts
        working-directory: release

      - name: Prepare and validate release files
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash ../tooling/.github/scripts/prepare-release.sh
        working-directory: release

      - name: Upload prepared release files
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/dist/index.js
            release/package-lock.json
            release/package.json
          if-no-files-found: error
          retention-days: 1

  finalize:
    needs: prepare
    # Commit the prepared release files and retarget the new point tag once.
    permissions:
      actions: read
      contents: write
    outputs:
      release-sha: ${{ steps.release.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Download prepared release files
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared

      - name: Commit release files and finalize published tag
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PREPARED_DIRECTORY: ${{ github.workspace }}/prepared
          RELEASE_DIRECTORY: ${{ github.workspace }}/release
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
        run: node tooling/.github/scripts/finalize-release.mjs

  update-major:
    needs: [prepare, finalize]
    # Move or create the verified major tag; no other repository writes are needed.
    permissions:
      contents: write
    concurrency:
      group:
        release-major-${{ github.repository }}-${{
        needs.prepare.outputs.major-tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Update moving major tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_SHA: ${{ needs.finalize.outputs.release-sha }}
        run: bash .github/scripts/update-major-tag.sh
