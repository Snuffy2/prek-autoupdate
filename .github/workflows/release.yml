name: Update Major Version Tag

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-v2:
    name: Move v2 tag
    if:
      ${{ !github.event.release.draft && !github.event.release.prerelease &&
      startsWith(github.event.release.tag_name, 'v2.') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Move v2 to the released commit
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git tag --force v2 "${RELEASE_TAG}^{commit}"
          git push --force origin refs/tags/v2
