name: Update Major Version Tag

on:
  release:
    types: [published]

jobs:
  update-major:
    name: Move major version tag
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    concurrency:
      group: update-major-version-tag
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Resolve major version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "major_tag=v${BASH_REMATCH[1]}" >>"${GITHUB_OUTPUT}"
            echo "valid=true" >>"${GITHUB_OUTPUT}"
          else
            echo "::notice::${RELEASE_TAG} is not a stable v-prefixed semantic version tag; no major tag will be moved."
            echo "valid=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Checkout release
        if: ${{ steps.version.outputs.valid == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Move major tag to the released commit
        if: ${{ steps.version.outputs.valid == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MAJOR_TAG: ${{ steps.version.outputs.major_tag }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          releases='[]'
          page=1
          while true; do
            response="$(
              curl --fail-with-body --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/releases?per_page=100&page=${page}"
            )"
            releases="$(jq --compact-output \
              --argjson page_releases "${response}" \
              '. + $page_releases' <<<"${releases}")"
            if [[ "$(jq 'length' <<<"${response}")" -lt 100 ]]; then
              break
            fi
            page=$((page + 1))
          done

          newest_major_release="$(
            jq --raw-output --arg major_tag "${MAJOR_TAG}" '
              map(select(
                (.draft | not) and
                (.prerelease | not) and
                (.tag_name | test(
                  "^" + $major_tag + "\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
                ))
              ))
              | if length == 0 then "" else max_by(.published_at).tag_name end
            ' <<<"${releases}"
          )"
          if [[ "${RELEASE_TAG}" != "${newest_major_release}" ]]; then
            echo "::error::${RELEASE_TAG} is not the newest published stable ${MAJOR_TAG} release (${newest_major_release:-none})."
            exit 1
          fi

          observed_major="$(
            git ls-remote --refs origin "refs/tags/${MAJOR_TAG}" |
              awk 'NR == 1 { print $1 }'
          )"
          git tag --force "${MAJOR_TAG}" "${RELEASE_TAG}^{commit}"
          git push \
            --force-with-lease="refs/tags/${MAJOR_TAG}:${observed_major}" \
            origin "refs/tags/${MAJOR_TAG}"
