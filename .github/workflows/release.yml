name: Release

run-name: Release ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.release.prerelease == false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up prek
        uses: j178/prek-action@v2
        with:
          install-only: true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare and validate release files
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          bash .github/scripts/prepare-release.sh

      - name: Export validated release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/index.js
          if-no-files-found: error
          retention-days: 1

  release:
    if: >-
      always() && !cancelled() && github.event.release.prerelease == false
    needs: prepare
    permissions:
      actions: write
      checks: read
      contents: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Require the default-branch release target
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TARGET" != "$DEFAULT_BRANCH" ]]; then
            echo "Release target must be the default branch." >&2
            exit 1
          fi
          echo "target=$RELEASE_TARGET" >> "$GITHUB_OUTPUT"

      - name: Check out trusted default-branch revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate release metadata and immutable starting refs
        id: base
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ steps.release.outputs.target }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag must use semantic vMAJOR.MINOR.PATCH syntax." >&2
            exit 1
          fi
          if [[ "$IS_PRERELEASE" != false || "$RELEASE_TAG" == *-* ]]; then
            echo "Release tag and published prerelease state disagree." >&2
            exit 1
          fi

          trusted_sha="$(git rev-parse HEAD)"
          git fetch --force --no-tags origin \
            "refs/heads/$RELEASE_TARGET:refs/remotes/origin/$RELEASE_TARGET" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          target_sha="$(git rev-parse "refs/remotes/origin/$RELEASE_TARGET")"
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          tag_oid="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          if [[ "$target_sha" != "$trusted_sha" ]]; then
            echo "Default branch moved before trusted helper execution." >&2
            exit 1
          fi

          resume=false
          tagged_version="$(git show "$tag_sha:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          tagged_lock_version="$(git show "$tag_sha:package-lock.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          tagged_root_version="$(git show "$tag_sha:package-lock.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).packages[""].version')"
          git cat-file -e "$tag_sha:dist/index.js"
          if [[ "$(git log -1 --format=%s "$tag_sha")" == "Release $RELEASE_TAG" ]]; then
            if [[ "$(git rev-list --parents -n 1 "$tag_sha" | wc -w)" -ne 2 ]] || \
              [[ "v$tagged_version" != "$RELEASE_TAG" ]] || \
              [[ "$tagged_lock_version" != "$tagged_version" ]] || \
              [[ "$tagged_root_version" != "$tagged_version" ]] || \
              ! git merge-base --is-ancestor "$tag_sha" "$target_sha"; then
              echo "Matching branch/tag release commit has invalid release contents." >&2
              exit 1
            fi
            changed_paths="$(git diff --name-only "$tag_sha^" "$tag_sha")"
            while IFS= read -r changed_path; do
              case "$changed_path" in
                dist/index.js | package-lock.json | package.json) ;;
                *)
                  echo "Matching release commit changes unexpected path: $changed_path" >&2
                  exit 1
                  ;;
              esac
            done <<< "$changed_paths"
            resume=true
            echo "candidate-sha=$tag_sha" >> "$GITHUB_OUTPUT"
          elif [[ "$target_sha" != "$tag_sha" ]]; then
            echo "Release tag and target branch must start at the same commit." >&2
            exit 1
          fi
          {
            echo "resume=$resume"
            echo "tag-sha=$tag_sha"
            echo "target-sha=$target_sha"
            echo "tag-oid=$tag_oid"
          } >> "$GITHUB_OUTPUT"

      - name: Download validated release bundle
        if: steps.base.outputs.resume != 'true'
        uses: actions/download-artifact@v5
        with:
          name: release-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-artifact

      - name: Reconstruct and validate release candidate
        if: steps.base.outputs.resume != 'true'
        env:
          RELEASE_ARTIFACT: ${{ runner.temp }}/release-artifact
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mapfile -t artifact_paths < <(find "$RELEASE_ARTIFACT" -type f -print)
          [[ "${#artifact_paths[@]}" -eq 1 ]]
          [[ "${artifact_paths[0]}" == "$RELEASE_ARTIFACT/index.js" ]]
          node .github/scripts/prepare-release.mjs
          cp "$RELEASE_ARTIFACT/index.js" dist/index.js
          changed_paths="$(git diff --name-only)"
          while IFS= read -r changed_path; do
            case "$changed_path" in
              dist/index.js | package-lock.json | package.json) ;;
              *)
                echo "Release artifact changed unexpected path: $changed_path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed_paths"
          [[ -z "$(git ls-files --others --exclude-standard)" ]]
          git add -- dist/index.js package-lock.json package.json
          git diff --cached --check

      - name: Create deterministic stable release commit
        if: github.event.release.prerelease == false
        id: candidate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RESUME: ${{ steps.base.outputs.resume }}
          RESUME_SHA: ${{ steps.base.outputs.candidate-sha }}
        run: |
          set -euo pipefail
          if [[ "$RESUME" == true ]]; then
            git diff --cached --quiet
            echo "sha=$RESUME_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Release $RELEASE_TAG"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish candidate to an isolated validation branch
        if: github.event.release.prerelease == false
        id: validation_ref
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          temp_ref="release-validation/${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git check-ref-format --branch "$temp_ref"
          gh auth setup-git --hostname github.com
          git push origin "$CANDIDATE_SHA:refs/heads/$temp_ref"
          echo "name=$temp_ref" >> "$GITHUB_OUTPUT"

      - name: Dispatch and verify immutable release gate
        if: github.event.release.prerelease == false
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          TEMP_REF: ${{ steps.validation_ref.outputs.name }}
        run: |
          set -euo pipefail
          node .github/scripts/verify-release-checks.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$TEMP_REF" \
            --sha "$CANDIDATE_SHA" \
            --required-check 'ci.yml::Node CI' \
            --required-check 'prek-autofix-review.yml::review'

      - name: Atomically advance target and guarded release tag
        if:
          github.event.release.prerelease == false && steps.base.outputs.resume
          != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_TAG_OID: ${{ steps.base.outputs.tag-oid }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ steps.release.outputs.target }}
          TARGET_SHA: ${{ steps.base.outputs.target-sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "refs/heads/$RELEASE_TARGET:refs/remotes/origin/$RELEASE_TARGET" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse "refs/remotes/origin/$RELEASE_TARGET")" == "$TARGET_SHA" ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG")" == "$ORIGINAL_TAG_OID" ]]
          candidate_sha="$(git rev-parse HEAD)"
          if [[ "$candidate_sha" != "$TARGET_SHA" ]]; then
            [[ "$(git rev-parse HEAD^)" == "$TARGET_SHA" ]]
          fi
          git tag -fa "$RELEASE_TAG" -m "Release $RELEASE_TAG" HEAD
          gh auth setup-git --hostname github.com
          git push --atomic \
            --force-with-lease="refs/heads/$RELEASE_TARGET:$TARGET_SHA" \
            --force-with-lease="refs/tags/$RELEASE_TAG:$ORIGINAL_TAG_OID" \
            origin "HEAD:refs/heads/$RELEASE_TARGET" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

      - name: Verify final release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ steps.release.outputs.target }}
          RESUME: ${{ steps.base.outputs.resume }}
          STABLE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          expected_sha="$STABLE_SHA"
          git fetch --force --no-tags origin \
            "refs/heads/$RELEASE_TARGET:refs/remotes/origin/$RELEASE_TARGET" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" == "$expected_sha" ]]
          git merge-base --is-ancestor \
            "$expected_sha" "refs/remotes/origin/$RELEASE_TARGET"
          package_version="$(git show "$expected_sha:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          lock_version="$(git show "$expected_sha:package-lock.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          root_version="$(git show "$expected_sha:package-lock.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).packages[""].version')"
          [[ "v$package_version" == "$RELEASE_TAG" ]]
          [[ "$lock_version" == "$package_version" ]]
          [[ "$root_version" == "$package_version" ]]
          git cat-file -e "$expected_sha:dist/index.js"

      - name: Update stable moving major tag
        if: github.event.release.prerelease == false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh auth setup-git --hostname github.com
          bash .github/scripts/update-major-tag.sh

      - name: Delete validated temporary branch
        if: github.event.release.prerelease == false && success()
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          TEMP_REF: ${{ steps.validation_ref.outputs.name }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git push \
            --force-with-lease="refs/heads/$TEMP_REF:$CANDIDATE_SHA" \
            origin ":refs/heads/$TEMP_REF"

  prerelease:
    if: github.event.release.prerelease == true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify prerelease identity without mutating refs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TARGET" == "$DEFAULT_BRANCH" ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]]
          git fetch --force --no-tags origin \
            "refs/heads/$RELEASE_TARGET:refs/remotes/origin/$RELEASE_TARGET" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          target_sha="$(git rev-parse "refs/remotes/origin/$RELEASE_TARGET")"
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          git merge-base --is-ancestor "$tag_sha" "$target_sha"
          package_version="$(git show "$tag_sha:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          lock_version="$(git show "$tag_sha:package-lock.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          root_version="$(git show "$tag_sha:package-lock.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).packages[""].version')"
          [[ "v$package_version" == "$RELEASE_TAG" ]]
          [[ "$lock_version" == "$package_version" ]]
          [[ "$root_version" == "$package_version" ]]
          git cat-file -e "$tag_sha:dist/index.js"
