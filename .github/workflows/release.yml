name: Release

run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v2.0.5 or v2.1.0-beta.1)
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    outputs:
      major-tag: ${{ steps.release.outputs.major-tag }}
      source-sha: ${{ steps.release.outputs.source-sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: release/package-lock.json

      - name: Set up prek
        uses: j178/prek-action@v2
        with:
          install-only: true

      - run: npm ci --ignore-scripts
        working-directory: release

      - name: Prepare and validate release files
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "Release workflow must be dispatched from $DEFAULT_BRANCH, not $RELEASE_REF." >&2
            exit 1
          fi

          tag_is_prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            tag_is_prerelease=true
          fi
          if [[ "$tag_is_prerelease" != "$IS_PRERELEASE" ]]; then
            echo "Release tag prerelease suffix and prerelease input must agree." >&2
            exit 1
          fi

          release_view_error="$RUNNER_TEMP/release-view-error.txt"
          if existing_release="$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease 2>"$release_view_error")"; then
            if [[ "$existing_release" != "$IS_PRERELEASE" ]]; then
              echo "Existing GitHub release prerelease state does not match the request." >&2
              exit 1
            fi
            echo "Resuming existing GitHub release: $RELEASE_TAG"
          elif ! grep -Eq "HTTP 404|release not found" "$release_view_error"; then
            cat "$release_view_error" >&2
            exit 1
          fi

          bash ../tooling/.github/scripts/prepare-release.sh
        working-directory: release

      - name: Upload prepared release files
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/dist/index.js
            release/package-lock.json
            release/package.json
          if-no-files-found: error
          retention-days: 1

  finalize:
    needs: prepare
    # Commit the prepared release files and create or retarget the point tag once.
    permissions:
      actions: read
      contents: write
    outputs:
      release-sha: ${{ steps.release.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Download prepared release files
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared

      - name: Commit release files and finalize release tag
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PREPARED_DIRECTORY: ${{ github.workspace }}/prepared
          RELEASE_DIRECTORY: ${{ github.workspace }}/release
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
        run: node tooling/.github/scripts/finalize-release.mjs

  publish:
    needs: finalize
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash .github/scripts/publish-release.sh

  update-major:
    needs: [prepare, finalize, publish]
    if: inputs.prerelease == false
    # Move or create the verified major tag; no other repository writes are needed.
    permissions:
      contents: write
    concurrency:
      group:
        release-major-${{ github.repository }}-${{
        needs.prepare.outputs.major-tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Update moving major tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ needs.finalize.outputs.release-sha }}
        run: bash .github/scripts/update-major-tag.sh
