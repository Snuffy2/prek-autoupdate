name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact candidate SHA required by the release workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node CI
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login == 'prek-autoupdate-bot' ||
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      !(contains(github.event.pull_request.labels.*.name, 'dependencies') ||
      github.event.pull_request.user.type == 'Bot')
    runs-on: ubuntu-latest
    steps:
      - name: Require the dispatched release candidate SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_SHA"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref:
            ${{ inputs.expected_sha || github.event.pull_request.head.sha ||
            github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - name: Verify bundled action
        run: npm run check:dist
