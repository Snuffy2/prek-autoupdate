name: Dependabot dependency auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-dependabot-metadata:
    if: >-
      github.event.repository.fork == false &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref ==
      github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fetch Dependabot metadata
        uses: dependabot/fetch-metadata@v3

  verify-changed-files:
    if: >-
      github.event.repository.fork == false &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref ==
      github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify supported dependency update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          changed_files="$(gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename')"
          [[ -n "${changed_files}" ]] || {
            echo "Refusing auto-merge; no changed files were reported"
            exit 1
          }
          npm_invalid_files="$(printf '%s\n' "${changed_files}" | grep -Ev '^package(-lock)?\.json$' || true)"
          if [[ -z "${npm_invalid_files}" ]] && \
            printf '%s\n' "${changed_files}" | grep -Fxq 'package-lock.json'; then
            exit 0
          fi

          actions_invalid_files="$(printf '%s\n' "${changed_files}" | grep -Ev '^\.github/workflows/[^/]+\.ya?ml$' || true)"
          if [[ -z "${actions_invalid_files}" ]]; then
            exit 0
          fi

          echo "Refusing auto-merge; changed files are neither a supported npm update nor a GitHub Actions-only update:"
          echo "${changed_files}"
          exit 1

  enable-auto-merge:
    needs: [verify-dependabot-metadata, verify-changed-files]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run:
          gh pr merge --auto --squash --match-head-commit "${HEAD_SHA}"
          "${PR_URL}"

  disable-auto-merge:
    if: >-
      failure() && !cancelled() && (needs.verify-dependabot-metadata.result ==
      'failure' || needs.verify-changed-files.result == 'failure') &&
      github.event.repository.fork == false &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref ==
      github.event.repository.default_branch
    needs: [verify-dependabot-metadata, verify-changed-files]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Disable an existing auto-merge request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          auto_merge_enabled="$(gh pr view "${PR_URL}" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "${auto_merge_enabled}" == true ]]; then
            gh pr merge --disable-auto "${PR_URL}"
          else
            echo "Auto-merge is not enabled."
          fi
